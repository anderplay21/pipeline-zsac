[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zsac_etl"
version = "0.1.0"
description = "ETL de reportes ZSAC (Excel) hacia SQL Server AnaliticaOperativa"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.3",
    "pyodbc>=5.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.scripts]
zsac-etl = "zsac_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sql: pruebas que requieren SQL Server local"]
